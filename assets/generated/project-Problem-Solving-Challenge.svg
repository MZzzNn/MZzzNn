<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 190" width="100%" role="img" aria-label="Problem Solving Challenge: Collection of problems and solutions of leetcode challenges in dart language.🤔💭">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#54c5f8"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="590" y2="190">
      <stop offset="0" stop-color="#54c5f8" stop-opacity=".9"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".06"/><stop offset="1" stop-color="#7c5cff" stop-opacity=".9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 295.0 95.0" to="360 295.0 95.0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity=".06"/></pattern>
    <clipPath id="card"><rect width="590" height="190" rx="18"/></clipPath>
  </defs>
  <style>
    .t{font:700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf7}
    .k{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9aa7bd;letter-spacing:2px}
    .s{font:400 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9aa7bd}
    .b{font:600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf7}
    .m{font:500 17px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#9aa7bd}
  </style>
  <g clip-path="url(#card)">
    <rect width="590" height="190" fill="url(#bg)"/>
    <rect width="590" height="190" fill="url(#dots)"/>
  </g>
  <rect x="1" y="1" width="588" height="188" rx="17" fill="none" stroke="url(#border)" stroke-width="2"/>
  <text x="32" y="50" class="t" style="font-size:23px">Problem Solving Challenge</text>
  <text x="32" y="86" class="s" style="font-size:17px">Collection of problems and solutions of leetcode</text>
  <text x="32" y="112" class="s" style="font-size:17px">challenges in dart language.🤔💭</text>
  <circle cx="38" cy="158" r="6" fill="#00B4AB"><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="1;.4;1"/></circle><text x="52" y="164" class="m" style="font-size:15px">Dart</text>
  <text x="558" y="164" text-anchor="end" class="m" style="font-size:15px"><tspan fill="#f5c542">★</tspan> 7   ⑂ 1</text>
</svg>
