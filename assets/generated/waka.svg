<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 494" width="100%" role="img" aria-label="Coding activity by language: Dart 75.9%, Other 12.4%, Markdown 3.8%, YAML 2.9%, JSON 0.8%, XML 0.7%, Bash 0.5%, Text 0.4%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#54c5f8"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="494">
      <stop offset="0" stop-color="#54c5f8" stop-opacity=".9"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".06"/><stop offset="1" stop-color="#7c5cff" stop-opacity=".9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 600.0 247.0" to="360 600.0 247.0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity=".06"/></pattern>
    <clipPath id="card"><rect width="1200" height="494" rx="18"/></clipPath>
  </defs>
  <style>
    .t{font:700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf7}
    .k{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9aa7bd;letter-spacing:2px}
    .s{font:400 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9aa7bd}
    .b{font:600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf7}
    .m{font:500 17px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#9aa7bd}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="494" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle cx="980" cy="40" r="120" fill="#54c5f8" opacity=".22">
        <animate attributeName="cx" dur="15s" repeatCount="indefinite" values="980;840;1040;980"/>
      </circle>
      <circle cx="120" cy="494" r="110" fill="#7c5cff" opacity=".22">
        <animate attributeName="cx" dur="18s" repeatCount="indefinite" values="120;260;80;120"/>
      </circle>
    </g>
    <rect width="1200" height="494" fill="url(#dots)"/>
  </g>
  <rect x="1" y="1" width="1198" height="492" rx="17" fill="none" stroke="url(#border)" stroke-width="2"/>
  <text x="60" y="62" class="t">Coding activity</text>
  <text x="262" y="62" class="s">all time, tracked by WakaTime</text>
  <text x="1140" y="62" text-anchor="end" style="font:700 26px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:url(#accent)">6,325 hrs 7 mins</text>
  <circle cx="68" cy="113" r="6" fill="#00B4AB"/><text x="86" y="119" class="b">Dart</text>
  <rect x="300" y="107" width="520" height="12" rx="6" fill="#ffffff" fill-opacity=".07"/>
  <rect x="300" y="107" width="0" height="12" rx="6" fill="#00B4AB"><animate attributeName="width" begin="0.2s" dur="1.1s" from="0" to="520" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></rect>
  <text x="848" y="119" class="m">4,799 hrs 22 mins</text>
  <text x="1140" y="119" text-anchor="end" class="b">75.88%</text>
