<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="100%" role="img" aria-label="6,335+ Hours coded, 49 Public repos, 134 Stars earned">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#54c5f8"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="170">
      <stop offset="0" stop-color="#54c5f8" stop-opacity=".9"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".06"/><stop offset="1" stop-color="#7c5cff" stop-opacity=".9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 600.0 85.0" to="360 600.0 85.0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity=".06"/></pattern>
    <clipPath id="card"><rect width="1200" height="170" rx="18"/></clipPath>
  </defs>
  <style>
    .t{font:700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf7}
    .k{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9aa7bd;letter-spacing:2px}
    .s{font:400 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9aa7bd}
    .b{font:600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf7}
    .m{font:500 17px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#9aa7bd}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="170" fill="url(#bg)"/>
    <rect width="1200" height="170" fill="url(#dots)"/>
  </g>
  <rect x="1" y="1" width="1198" height="168" rx="17" fill="none" stroke="url(#border)" stroke-width="2"/>
  <g opacity="0"><animate attributeName="opacity" begin="0.2s" dur="0.6s" from="0" to="1" fill="freeze"/><animateTransform attributeName="transform" type="translate" begin="0.2s" dur="0.6s" from="0 14" to="0 0" fill="freeze"/><text x="240" y="86" text-anchor="middle" style="font:700 46px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#accent)">6,335+</text><text x="240" y="122" text-anchor="middle" class="k">HOURS CODED</text></g>
  <g opacity="0"><animate attributeName="opacity" begin="0.35s" dur="0.6s" from="0" to="1" fill="freeze"/><animateTransform attributeName="transform" type="translate" begin="0.35s" dur="0.6s" from="0 14" to="0 0" fill="freeze"/><text x="600" y="86" text-anchor="middle" style="font:700 46px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#accent)">49</text><text x="600" y="122" text-anchor="middle" class="k">PUBLIC REPOS</text></g>
  <rect x="420" y="50" width="1" height="72" fill="#ffffff" opacity=".1"/>
  <g opacity="0"><animate attributeName="opacity" begin="0.5s" dur="0.6s" from="0" to="1" fill="freeze"/><animateTransform attributeName="transform" type="translate" begin="0.5s" dur="0.6s" from="0 14" to="0 0" fill="freeze"/><text x="960" y="86" text-anchor="middle" style="font:700 46px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#accent)">134</text><text x="960" y="122" text-anchor="middle" class="k">STARS EARNED</text></g>
  <rect x="780" y="50" width="1" height="72" fill="#ffffff" opacity=".1"/>
</svg>
