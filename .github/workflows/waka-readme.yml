name: Waka Time Readme

on:
  # for manual workflow trigger
  workflow_dispatch:
  schedule:
    # Runs every 2 hours
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update WakaTime stats in README
        env:
          WAKATIME_USERNAME: MZzzNn
          TIME_RANGE: last_7_days # all_time needs WakaTime premium
          LANG_COUNT: 10
        run: python3 .github/scripts/waka.py

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then echo "Nothing to commit"; exit 0; fi
          git config user.name "GitHubActionBot"
          git config user.email "action-bot@github.com"
          git commit -am "Updated waka-readme graph with new metrics"
          git push
