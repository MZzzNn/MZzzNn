name: Waka Time Readme

on:
  # for manual workflow trigger
  workflow_dispatch:
  schedule:
    # Runs every 2 hours
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rebuild profile cards
        env:
          GH_TOKEN: ${{ github.token }}
          TIME_RANGE: all_time # must match "Display code time publicly" range on wakatime.com/settings/profile
        run: python3 .github/scripts/profile.py

      - name: Commit changes
        run: |
          git add assets/generated
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git config user.name "GitHubActionBot"
          git config user.email "action-bot@github.com"
          git commit -m "Updated profile cards with new metrics"
          git pull --rebase
          git push
